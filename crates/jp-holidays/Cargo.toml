[package]
name = "jp-holidays"
description = "Generator for the static jp-holidays JSON API (deployed to GitHub Pages)."
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "jp-holidays"
path = "src/main.rs"

[dependencies]
jp-holidays-lib = { path = "../jp-holidays-lib", features = ["fetch"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
