[package]
name = "jp-holidays-lib"
description = "Japanese holiday library for working with public holiday data in Rust."
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
documentation = "https://docs.rs/jp-holidays-lib"
categories = ["date-and-time", "internationalization", "data-structures"]
keywords = ["japan", "holiday", "calendar", "datetime", "localization"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Enables `Client::fetch()`, which downloads the latest holiday data from the
# Cabinet Office of Japan at runtime. Pulls in `reqwest` and `encoding_rs`.
fetch = ["dep:reqwest", "dep:encoding_rs"]

[dependencies]
chrono = { workspace = true }
thiserror = { workspace = true }
encoding_rs = { version = "0.8.35", optional = true }
reqwest = { version = "0.12.15", features = [
    "rustls-tls",
], default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true
