name: Refresh Bundled Holiday Data (crates/jp-holidays-lib)

# Downloads the latest holiday CSV from the Cabinet Office of Japan. If it
# differs from the bundled copy, bumps the patch version and opens a PR for
# review. Publishing is done manually after merge.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh Data
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crates/jp-holidays-lib/

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and convert CSV
        run: |
          curl -sSL --fail --max-time 60 \
            -o /tmp/syukujitsu_raw.csv \
            "https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv"
          iconv -f SHIFT_JIS -t UTF-8 /tmp/syukujitsu_raw.csv \
            | sed 's/\r$//' > src/data/syukujitsu.csv

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/syukujitsu.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in holiday data."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Holiday data changed."
          fi

      - name: Setup Rust Toolchain
        if: steps.diff.outputs.changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        id: bump
        run: |
          current=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          sed -i -E "0,/^version = \".*\"/s//version = \"${next}\"/" Cargo.toml
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${current} -> ${next}"

      - name: Verify build and tests
        if: steps.diff.outputs.changed == 'true'
        run: cargo test --lib

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-holiday-data
          commit-message: "chore: refresh bundled holiday data (v${{ steps.bump.outputs.version }})"
          title: "chore: refresh bundled holiday data (v${{ steps.bump.outputs.version }})"
          body: |
            The Cabinet Office holiday CSV changed. This PR updates the bundled
            data in `crates/jp-holidays-lib/src/data/syukujitsu.csv` and bumps
            the patch version to `${{ steps.bump.outputs.version }}`.

            Publish to crates.io manually after merge.
          add-paths: |
            crates/jp-holidays-lib/src/data/syukujitsu.csv
            crates/jp-holidays-lib/Cargo.toml
