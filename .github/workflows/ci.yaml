name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: fmt + clippy + hermetic tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run CI (fmt-check, lint, test)
        run: just ci

  msrv:
    name: MSRV check (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MSRV toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"

      # rust-toolchain.toml pins `stable`, so force the MSRV explicitly with `+1.85`.
      - name: Check against MSRV
        run: cargo +1.85 check --workspace --all-features
