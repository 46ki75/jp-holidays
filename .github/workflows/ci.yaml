name: CI

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt + clippy + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Install just and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov

      # Run the checks individually so the test run is instrumented for coverage
      # exactly once (the pre-commit `just ci` stays a fast, hermetic run).
      - name: Format check
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Coverage (instrumented tests -> lcov.info)
        run: just coverage-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false

  msrv:
    name: MSRV check (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MSRV toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"

      # rust-toolchain.toml pins `stable`, so force the MSRV explicitly with `+1.85`.
      - name: Check against MSRV
        run: cargo +1.85 check --workspace --all-features
